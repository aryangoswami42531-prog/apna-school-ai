<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Portal — School ERP Ecosystem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f3f4f6; padding: 40px 20px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: rgba(18, 26, 45, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; }
    h1 { font-family: 'Outfit', sans-serif; color: #10b981; margin-bottom: 10px; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; margin-top: 20px; }
    .btn { display: inline-block; background: linear-gradient(135deg, #10b981, #14b8a6); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>👨‍👩‍👦 Parent Portal</h1>
    <p>Welcome, <strong>Mr. Rajesh Sharma</strong> (Parent of Rahul Sharma - Grade 10-A)</p>

    <div class="card">
      <h3>Child Overview</h3>
      <p>Rahul's Attendance: <strong>91.2%</strong> | Class Teacher: Ms. Priya Nair</p>
      <p>Consult XYZ AI to review child logs or submit callback requests to the class teacher.</p>
      <a href="http://localhost:5173/?role=parent" class="btn">🚀 Launch XYZ AI Assistant (Parent Mode)</a>
    </div>
  </div>
</body>
</html>
